<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni 1.2 Flash Prompt Builder Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="pb-24">

  <!-- Sticky Top Header: แถบควบคุมโควตาและโหมด -->
  <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 shadow-lg">
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="bg-rose-600 text-white text-xs font-bold px-2 py-1 rounded">OMNI 1.2</span>
          <h1 class="text-base font-bold text-white">Prompt Builder Pro</h1>
        </div>
        <button id="btnReset" class="text-xs text-slate-400 hover:text-white border border-slate-700 px-2.5 py-1 rounded-lg">
          รีเซ็ตค่า
        </button>
      </div>

      <!-- ตัววัดโควตาจริงของ Omni Flash -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div id="quotaImageBox" class="bg-slate-800 border border-emerald-500/40 rounded-lg px-3 py-1.5 flex justify-between items-center">
          <span class="text-slate-300">โควตาภาพอ้างอิง:</span>
          <span id="quotaImageText" class="font-bold text-emerald-400">0 / 6 ภาพ</span>
        </div>
        <div id="quotaTimeBox" class="bg-slate-800 border border-sky-500/40 rounded-lg px-3 py-1.5 flex justify-between items-center">
          <span class="text-slate-300">ความยาวรวม:</span>
          <span id="quotaTimeText" class="font-bold text-sky-400">0.0s / 15.0s</span>
        </div>
      </div>
    </div>
  </header>

  <!-- พื้นที่เนื้อหาหลัก -->
  <main class="max-w-2xl mx-auto px-4 pt-4 space-y-4">
    
    <!-- เลือกโหมดการทำงาน -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-3">
      <label class="block text-xs text-slate-400 mb-2 font-medium">เลือกโหมดการทำงานของ Omni Flash</label>
      <div class="grid grid-cols-3 gap-1.5 text-xs font-medium">
        <button data-mode="generate" class="mode-btn bg-rose-600 text-white py-2 px-2 rounded-lg text-center">สร้างวิดีโอใหม่</button>
        <button data-mode="edit" class="mode-btn bg-slate-700 text-slate-300 py-2 px-2 rounded-lg text-center">แก้ไขคลิปเดิม</button>
        <button data-mode="extend" class="mode-btn bg-slate-700 text-slate-300 py-2 px-2 rounded-lg text-center">ต่อความยาวคลิป</button>
      </div>
    </section>

    <!-- ตั้งค่าพื้นฐาน: อัตราส่วนภาพ -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-xl p-3">
      <label class="block text-xs text-slate-400 mb-1.5 font-medium">อัตราส่วนภาพ (Aspect Ratio)</label>
      <select id="aspectRatio" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
        <option value="16:9">16:9 (แนวนอนมาตรฐาน YouTube / สื่อการสอน)</option>
        <option value="9:16">9:16 (แนวตั้ง TikTok / Reels / Shorts)</option>
        <option value="1:1">1:1 (จัตุรัส Social Media)</option>
      </select>
    </section>

    <!-- พื้นที่สำหรับขั้นที่ 2 และ 3 -->
    <div id="dynamicWorkspace" class="space-y-4"></div>

  </main>
</body>
</html>
